name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          rustup target add x86_64-unknown-linux-musl
          make release
      - run: gh release create "build-$GITHUB_RUN_NUMBER" target/x86_64-unknown-linux-musl/release/runbox --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
